name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Geography codegen drift check
        run: |
          npm run codegen:geography
          git diff --exit-code src/data/geography.ts || {
            echo "::error::src/data/geography.ts is stale. Run 'npm run codegen:geography' and commit the result.";
            exit 1;
          }
      - name: Slug gate
        run: npm run check:slugs
      - name: State-claims gate
        run: npm run check:state-claims
      - name: Page graph gate
        run: npm run check:pages
      - name: Asset existence gate
        run: npm run check:assets
      - name: Internal link gate
        run: npm run check:links
      - name: Build
        run: npm run build
